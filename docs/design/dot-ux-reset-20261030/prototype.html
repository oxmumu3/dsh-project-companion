/* Secondary pages share the same typography, rows and small actions. */
.plain-page { max-width:850px; }

.project-list,.connect-group { border-top:1px solid var(--color-rule); }

/* Details remain secondary, with readable source and history boundaries. */
dialog { border:1px solid var(--color-rule); border-radius:12px; padding:0; background:var(--color-surface); color:var(--color-ink); box-shadow:none; width:min(560px,calc(100% - var(--space-lg))); max-height:calc(100dvh - 40px); }

/* The app work surface: phone pairing and desktop work are peers, not a hero. */
.shell { width:100%; max-width:var(--container); margin-inline:auto; padding:0 var(--gutter) var(--space-2xl); display:grid; grid-template-columns:minmax(0,1fr); }
.header { display:flex; align-items:center; justify-content:space-between; gap:var(--space-lg); padding:var(--space-md) 0; }
.nav { display:flex; gap:var(--space-lg); border-bottom:1px solid var(--color-rule); }
.nav button { position:relative; padding:var(--space-xs) 0; min-height:40px; font-size:var(--text-sm); font-weight:400; color:var(--color-muted); border-radius:0; background:var(--color-clear); }
.nav button[aria-selected=true] { color:var(--color-accent); background:none; }
.nav button[aria-selected=true]:after { content:""; position:absolute; height:2px; bottom:-1px; left:0; right:0; background:var(--color-accent); }
.main { padding-top:var(--space-lg); }
.layout { display:grid; grid-template-columns:minmax(0,1fr) 264px; gap:var(--space-xl); align-items:start; }
.primary-column { min-width:0; }
.primary-column:has(.first-connect:not(.connected)) { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:var(--space-md); align-items:start; }
.primary-column:has(.first-connect:not(.connected))>.first-connect { grid-column:1; grid-row:1 / span 2; }
.primary-column:has(.first-connect:not(.connected))>#home-mount { grid-column:2; grid-row:1; }
.primary-column:has(.first-connect:not(.connected))>.starter-row { grid-column:2; grid-row:2; margin:0; }
.primary-column:has(.first-connect:not(.connected))>.conversation-result,
.primary-column:has(.first-connect:not(.connected))>.new-user-intro,
.primary-column:has(.first-connect:not(.connected))>.main-footer { grid-column:1 / -1; }
.first-connect { background:var(--color-paper-2); border:0; border-radius:var(--radius-card); margin:0; min-width:0; }
.first-connect-grid { display:grid; grid-template-columns:minmax(0,1fr); gap:var(--space-sm); }
.first-connect-copy { padding:var(--space-md) var(--space-md) 0; }
.first-connect h2 { font-size:var(--text-xl); font-weight:600; }
.first-connect p { font-size:var(--text-sm); }
.first-connect .connection-condition { font-size:var(--text-xs); }
.first-connect-actions { margin-top:var(--space-xs); }
.inline-code { border:0; padding:var(--space-sm) var(--space-md) var(--space-md); background:var(--color-clear); display:grid; grid-template-columns:128px minmax(0,1fr); gap:var(--space-xs) var(--space-sm); align-items:center; text-align:left; }
.inline-code-status { grid-column:2; grid-row:1; align-self:end;  font-variant-numeric:tabular-nums; }
.qr-placeholder { grid-column:1; grid-row:1 / span 3; border:0; border-radius:0; background:var(--color-surface); margin:0; padding:var(--space-sm); }
.qr-demo-label { grid-column:2; grid-row:2; }
.qr-demo-controls { grid-column:2; grid-row:3; display:flex; flex-direction:column; align-items:flex-start; justify-content:flex-start; gap:0; margin:0; }
.qr-demo-controls button { font-size:var(--text-xs); min-height:32px; }
.qr-placeholder svg path[fill],.qr-placeholder svg rect { fill:var(--color-surface); }
.qr-placeholder svg text { fill:var(--color-accent); font-family:var(--font-body); }
.first-connect.connected { border:0; border-radius:0; border-bottom:1px solid var(--color-rule); background:var(--color-paper); padding:0 0 var(--space-md); margin-bottom:var(--space-md); }
.composer { background:var(--color-paper); border:1px solid var(--color-edge); border-radius:var(--radius-input); padding:var(--space-md); box-shadow:none; }
.composer:focus-within { border-color:var(--color-focus); box-shadow:none; outline:2px solid var(--color-focus); outline-offset:2px; }
.composer textarea { display:block; border:0; background:var(--color-clear); width:100%; min-height:96px; max-height:176px; padding:0; resize:vertical; font-size:var(--text-md); line-height:1.6; outline:0; }
.composer textarea:focus-visible { outline:0; }
.composer-hint { font-size:var(--text-xs); }
.primary { min-height:36px; border-radius:var(--radius-input); white-space:nowrap; }

.attention-footer { padding-top:var(--space-xs); }
.attention-action button,.source-button { font-size:var(--text-xs); min-height:32px; }
.rail { background:var(--color-paper-2); padding:var(--space-lg); border:0; border-radius:0; }
.rail section { padding:0 0 var(--space-lg); margin-bottom:var(--space-lg); }

<body>
<div class="demo-bar"><span class="demo-label">交互方案　示例数据　不读取资料或发送消息</span><div class="demo-switch"><label for="demo-state">演示状态</label><select id="demo-state"><option value="daily">日常使用</option><option value="first">首次使用</option><option value="issue">连接问题</option></select><button id="reset-demo" type="button">重置演示</button></div></div>

<script>
'use strict';
const icons={dot:'<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"/><path d="M17.8 3.3l2.5 1.7-1.8 2.4"/>',history:'<path d="M4 8a8 8 0 1 1-.2 7M4 3v5h5M12 7v5l3 2"/>',arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',close:'<path d="M6 6l12 12M18 6L6 18"/>',expand:'<path d="M14 4h6v6M20 4l-9 9M10 5H5v14h14v-5"/>',risk:'<path d="M12 3L2 20h20L12 3zM12 9v5M12 17h.01"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18M7 14h3M7 17h6"/>',source:'<path d="M9 14l6-6M7 16H5a3 3 0 0 1-3-3V5a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v2M10 8h6v6"/>',check:'<path d="M5 12l4 4L19 6"/>',project:'<path d="M3 7h7l2-3h9v16H3zM7 11h10M7 15h7"/>',mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 6l9 7 9-7"/>',note:'<path d="M5 3h14v14l-4 4H5zM9 8h6M9 12h6M15 21v-4h4"/>',chat:'<path d="M5 4h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-5 3v-3a2 2 0 0 1-2-2V6a2 2 0 0 1 3-2z"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/>'};
const icon=name=>`<svg viewBox="0 0 24 24" aria-hidden="true">${icons[name]||icons.note}</svg>`;
function fillIcons(root=document){root.querySelectorAll('[data-icon]').forEach(e=>e.innerHTML=icon(e.dataset.icon));}
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
let state={page:'today',demo:'daily',draft:'',draftBackups:[],draftRestored:false,qrExpired:false,overlay:false,done:false,paused:false,recovered:false,connected:new Set(),messages:[],result:null,showAttention:true};
const scripts={
 risk:{title:'继续处理参数限制通知',text:'把这条参数限制通知整理成待核对清单。',resultTitle:'这条通知，先核对两件事',reply:'先在管理页面确认完整的受限参数和对应事件；再请集成负责人判断这些事件是否被现有投放使用。邮件尚未证明投放已经受影响，因此当前先做核对，不直接下结论或调整配置。',source:'示例邮件 A',next:'已整理为示例行动建议，未派发给任何人，也没有更改广告配置。'},
 priorities:{title:'先处理哪件事',text:'帮我排一下这两件事的下一步。',resultTitle:'先核对风险，再处理有期限的邀请',reply:'先请集成负责人核对完整的受限参数和受影响事件，确认是否需要调整。开发者邀请明天 18:00 到期，今天先核对账号与权限，再决定接受。没有证据说明广告已受影响，也不知道邀请是否已被处理。',source:'示例邮件 A、B',next:'这是一份示例行动建议，尚未派发任务或接受邀请。'},
 schedule:{title:'整理今天的安排',text:'根据示例日历，整理今天的安排。',resultTitle:'今天的安排，留出一个准备窗口',reply:'示例日历有两场会议：14:30 项目进展讨论，16:00 设计评审。可以在 14:00 前整理项目现状和一个待决定的问题。会议时间不是任务截止时间；是否需要额外准备，仍取决于会议要求。',source:'示例日历 C',next:'仅整理这两条示例安排，没有修改日历或建立提醒。'},
 project:{title:'接着推进项目',text:'帮我接着推进「阅读助理」项目。',resultTitle:'下一步，验证一次真实使用',reply:'示例项目已完成资料检索原型，待验证的是用户能否找到来源并继续追问。建议选一篇公开文章，走完“提问—看来源—补问”这一条任务；先记录卡在哪里，再改界面。',source:'示例项目进度 D',next:'这是下一步建议，尚未交办、执行或改动文件。'}
};
const sources={
 a:{title:'示例邮件 A · 参数限制通知',meta:'虚构邮件\n今天 09:05\n本原型内展示',text:'两个事件参数已被限制。请到管理页面查看完整参数及对应事件。继续违规可能影响后续功能。',boundary:'通知没有证明广告表现已受影响，也没有提供完整事件清单。'},
 b:{title:'示例邮件 B · 开发者邀请',meta:'虚构邮件\n今天 08:40\n本原型内展示',text:'你的开发者团队邀请将在明天 18:00 到期。请登录后核对账号和所授角色，再决定是否接受。',boundary:'当前示例不知道你是否已经接受。它不会代你点邀请。'},
 c:{title:'示例日历 C · 今天两场会议',meta:'虚构日历\n10 月 30 日\n本地时间',text:'14:30–15:00 项目进展讨论\n16:00–16:45 设计评审',boundary:'只展示这两条示例，不代表完整日历。会议开始时间不是交付期限。'},
 d:{title:'示例项目进度 D · 阅读助理',meta:'虚构项目\n今天 08:30 更新',text:'资料检索原型已完成。真实使用路径尚待验收：提问、定位原文、继续追问。下一步选择公开文章进行一轮验证。',boundary:'进度文字是示例，不代表任何真实项目已交付。'}
};
const starterRow=()=>`<div class="starter-row" aria-label="可演示的交代"><button class="starter" type="button" data-starter="priorities">${icon('risk')}先处理哪件事</button><button class="starter" type="button" data-starter="schedule">${icon('calendar')}整理今天的安排</button><button class="starter" type="button" data-starter="project">${icon('project')}接着推进项目</button></div>`;
function showToast(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>$('toast').hidden=true,3500);}
function showDetail(title,html){$('detail-title').textContent=title;$('detail-content').innerHTML=html;$('detail-dialog').showModal();}
function showSource(id){const s=sources[id];if(!s)return;showDetail(s.title,`<p class="source-meta">${s.meta}</p><blockquote>${escapeHTML(s.text).replaceAll('\n','<br>')}</blockquote><p>${s.boundary}</p><p class="dialog-footnote">演示来源，不会打开邮箱、日历或本机文件。</p>`);}
function attentionHTML(){return `<div class="section-top"><h3 class="section-label">需要你关注</h3><span class="small muted">${state.demo==='issue'&&!state.recovered?'上次保存 09:10':'示例结果 · 今天 09:10'}</span></div><div class="attention-list">
<article class="attention"><span class="attention-icon">${icon('risk')}</span><div class="attention-kicker"><strong>值得核对</strong><span>来源已说明，影响待确认</span></div><h3>广告事件参数被限制</h3><p>通知只列了部分参数，尚无证据证明投放已受影响。</p><p class="next-step">下一步：核对完整参数及受影响事件，再决定是否调整。</p><div class="attention-footer"><button type="button" class="source-button" data-source="a">${icon('source')}查看示例邮件</button><div class="attention-action"><button type="button" data-prepare="risk">帮我拆成下一步</button></div></div></article>
<article class="attention ${state.done?'done':''}"><span class="attention-icon">${icon(state.done?'check':'clock')}</span><div class="attention-kicker"><strong>${state.done?'已处理（示例）':'明天 18:00 到期'}</strong><span>${state.done?'反馈已回到这件事':'按示例本地时间'}</span></div><h3>开发者团队邀请，需要你决定</h3><p>${state.done?'已从待处理事项中标记完成，原始记录仍在。':'先核对受邀账号和权限，再决定是否接受；当前不知道你是否已处理。'}</p><div class="attention-footer"><button type="button" class="source-button" data-source="b">${icon('source')}查看邀请原文</button><div class="attention-action"><button type="button" data-action="done">${state.done?'撤销示例标记':'标为已处理'}</button></div></div></article></div>`;}
function railHTML(){if(state.demo==='first')return `<aside class="rail first-use-rail"><section><h3>需要资料时，再连接</h3><p class="rail-empty">想结合邮件、日程、笔记或待办一起判断时，再连接相应来源。</p><button type="button" class="rail-link" data-page="connections">看看可用的资料来源 ${icon('arrow')}</button><p class="small muted" style="margin-top:10px">连接来源不会自动开启定时回顾或推送。</p></section></aside>`;
const issue=state.demo==='issue'&&!state.recovered;return `<aside class="rail"><section><h3>下一次安排</h3><p class="eyebrow-note">${issue?'最新状态待核对':'以下为已保存的示例安排'}</p>${issue?'<p class="rail-empty">暂时未能确认微信安排。不会据此判断计划已停止，也不会重新创建。</p>':state.paused?'<p class="rail-empty">示例安排已暂停。再次开启会恢复这些安排，不另建一份。</p>':`<div class="schedule"><time>09:00</time><div class="schedule-item"><strong>明天的个人回顾</strong><p>风险、临期事项与项目变化</p></div><time>09:10</time><div class="schedule-item"><strong>你的 AI 日报</strong><p>3 篇重点，最多 7 条简讯</p></div></div><div class="interest-tags"><span>Agent 产品</span><span>插件生态</span><span>增长实践</span></div>`}<div class="rail-bottom"><span>${issue?'原安排状态待确认，不会自动新建':'每周一 09:00 另有周回顾'}</span>${issue?'':`<button type="button" data-action="pause">${state.paused?'恢复示例':'暂停示例'}</button>`}</div></section><section><h3>用到哪些资料</h3><div class="source-overview"><span class="status-dot"></span><span>5 个示例来源已连接</span></div><p class="source-names">Gmail、日历、Drive、flomo、滴答清单</p><p class="small muted">只按当前请求或已保存的安排使用，不代表整个账号都已读过。</p><button type="button" class="rail-link" data-page="connections">查看资料范围 ${icon('arrow')}</button></section></aside>`;}
function issueHTML(){if(state.demo!=='issue')return '';return state.recovered?`<div class="notice success" role="status">${icon('check')}<div><strong>示例连接状态已恢复</strong><p>原来的安排与草稿都保留，没有新建计划。</p></div></div>`:`<div class="notice" role="status">${icon('risk')}<div><strong>暂时未能确认微信安排，桌面对话可以继续</strong><p>下面保留上次的结果；新的变化尚未核对。</p></div><button type="button" data-action="retry">重试状态</button></div>`;}
function resultHTML(){if(!state.result)return '';const s=scripts[state.result];return `<article class="current-result"><div class="result-kicker">刚刚这件事 · 示例回复</div><h3>${s.resultTitle}</h3><p>${s.reply}</p><p class="small muted" style="margin-top:8px">依据：${s.source}。${s.next}</p><div class="result-actions"><button type="button" data-action="focus">继续补充</button><button type="button" data-action="history">查看这次对话</button></div></article>`;}
function qrDemoSVG(){return `<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M2 2h27v27H2zM71 2h27v27H71zM2 71h27v27H2z"/><path fill="#fff" d="M7 7h17v17H7zM76 7h17v17H76zM7 76h17v17H7z"/><path d="M11 11h9v9h-9zM80 11h9v9h-9zM11 80h9v9h-9zM36 2h8v8h-8zM49 3h5v13h-5zM58 2h5v7h-5zM36 16h8v12h-8zM54 21h10v7H54zM3 38h9v8H3zM18 36h9v14h-9zM2 55h5v9H2zM12 57h13v7H12zM72 36h10v7H72zM88 36h9v13h-9zM76 51h7v12h-7zM91 58h7v7h-7zM36 73h7v9h-7zM48 76h7v14h-7zM36 89h7v9h-7zM61 72h7v6h-7zM62 85h7v13h-7zM76 73h13v8H76zM92 74h6v15h-6zM76 90h8v8H76zM89 94h9v4h-9z"/><rect x="29" y="31" width="42" height="37" rx="4" fill="#fff"/><text x="50" y="53" text-anchor="middle" font-size="13" font-family="sans-serif" fill="#4169e1">演示</text></svg>`;}
function firstConnectHTML(){if(state.connected.has('wechat'))return `<section class="first-connect connected" aria-label="微信连接状态">${icon('check')}<div><h2>微信已连接 · 示例</h2><p>可以在微信继续交代、收结果。提醒和日报仍需你主动开启；电脑与 Harness 需保持在线。</p></div></section>`;return `<section class="first-connect" aria-labelledby="first-connect-title"><div class="first-connect-grid"><div class="first-connect-copy"><h2 id="first-connect-title">把 Dot 带到微信里</h2><p>在手机上交代任务、收结果，也能收到你已开启的提醒。</p><div class="first-connect-actions"><button type="button" class="text-button" data-action="focus">先在电脑上试试 ${icon('arrow')}</button></div><p class="connection-condition">电脑和 Harness 需保持在线。扫码不会自动开启推送。</p></div><div class="inline-code" id="first-wechat-code" tabindex="-1" aria-label="微信连接示意码，不用于连接"><p class="inline-code-status">${state.qrExpired?'二维码已过期 · 演示':'微信扫一扫 · 等待扫码'}</p><div class="qr-placeholder">${qrDemoSVG()}${state.qrExpired?'<div class="qr-expired-mask"><span>示意码已过期</span><button type="button" class="primary" data-action="qr-refresh">刷新二维码</button></div>':''}</div><div class="qr-demo-label">示意码 · 不用于连接</div><div class="qr-demo-controls">${state.qrExpired?'':'<button type="button" data-action="qr-complete">演示扫码完成</button><button type="button" data-action="qr-expire">演示过期</button>'}</div></div></div></section>`;}
function showWechatCode(){navigate('today');const code=$('first-wechat-code');if(code){code.focus({preventScroll:true});code.scrollIntoView({block:'nearest',behavior:'instant'});}}

function renderToday(){const first=state.demo==='first';return `${issueHTML()}${first?'':`<div class="page-heading"><div><h2>${first?'先把一件事交给 Dot。':state.demo==='issue'&&!state.recovered?'上次留下的事，可以接着聊。':state.done?'还有一件事，值得你留意。':'今天有两件事，值得你留意。'}</h2><p>${first?'说一句目标；用到资料时，再连接相应来源。':'先看清发生了什么，再决定下一步。'}</p></div><span class="date">10 月 30 日，星期五 · 示例</span></div>`}<div class="layout"><section class="primary-column" aria-label="当前事情与对话">${first?firstConnectHTML():''}<div id="home-mount"></div>${starterRow()}<div class="conversation-result">${resultHTML()}</div>${!first?(state.result&&!state.showAttention?`<div class="collapsed-attention"><span>${state.done?'1 件事项待确认':'2 件事项待确认'}</span><button type="button" data-action="show-attention">展开查看</button></div>`:attentionHTML()):!state.result?'<div class="new-user-intro"><h3>不用先把所有东西配好。</h3><p>先聊手上的任务、拆解下一步。想结合邮件、日程或项目再判断时，再连接需要的资料。</p></div>':''}<div class="main-footer"><span>选择示例可演示；自由输入只保留草稿。</span><button type="button" data-action="history">找到之前聊过的事</button></div></section>${railHTML()}</div>`;}
function renderProjects(){return `<div class="plain-page"><div class="page-heading"><div><h2>把项目接着做下去。</h2><p>先找到当前这件事，背景和进展一起带上。</p></div></div><div class="project-list"><article class="project-row"><div><h3>阅读助理</h3><p>原型已完成，下一步验证“提问—看来源—补问”的完整路径。</p><p class="row-meta">示例项目 · 今天 08:30 更新</p></div><button type="button" class="secondary" data-starter="project">接着推进</button></article><article class="project-row"><div><h3>每周内容计划</h3><p>本周选题已列出，待选择一篇进入初稿。</p><p class="row-meta">示例项目 · 昨天 17:20 更新</p></div><button type="button" class="text-button" data-action="project-detail">查看进展</button></article></div><p class="page-tip">在任何页面，都可以点右下角 Dot 直接继续说。无需回到首页。</p></div>`;}
function renderMemory(){return `<div class="plain-page"><div class="page-heading"><div><h2>记住对你有用的事。</h2><p>看得见来源，也能随时修正。</p></div></div><div class="project-list"><article class="memory-row"><div><h3>AI 日报的关注方向</h3><p>Agent 产品、插件生态、增长实践</p><p class="row-meta">来自虚构的演示对话 · 10 月 29 日</p></div><button type="button" class="text-button" data-action="memory-detail">查看与修改</button></article><article class="memory-row"><div><h3>阅读助理的下一步</h3><p>先走完一个真实使用任务，再决定要扩哪些功能。</p><p class="row-meta">来自示例项目进度 · 今天 08:30</p></div><button type="button" class="text-button" data-source="d">查看来源</button></article></div><p class="page-tip">本页均为示例记忆，不会写入你的长期记忆或外部笔记。</p></div>`;}
const connectRows=[['google','mail','Google 三件套','用邮件、日历和云盘资料，准备当前这件事。'],['flomo','note','flomo','找回你记下的想法与线索。'],['dida','check','滴答清单','看待办与截止时间，处理反馈以任务记录为准。'],['wechat','chat','微信','离开电脑后，接着交代、收结果与提醒。']];
function renderConnections(){return `<div class="plain-page"><div class="page-heading"><div><h2>按需连接，用在具体的事上。</h2><p>连接不会自动启动后台扫描或推送。</p></div></div><div class="connect-group">${(state.demo==='first'?[...connectRows.filter(r=>r[0]==='wechat'),...connectRows.filter(r=>r[0]!=='wechat')]:connectRows).map(([id,i,title,desc])=>{const connected=state.demo!=='first'||state.connected.has(id);return `<article class="connect-row"><span class="connect-icon">${icon(i)}</span><div><h3>${title}</h3><p>${desc}</p></div>${connected?`<button type="button" class="connected" data-connect="${id}">${state.demo==='issue'&&!state.recovered&&id==='wechat'?'状态待核对':'已连接 · 示例'}</button>`:`<button type="button" class="secondary" data-connect="${id}">${id==='wechat'?'连接微信':'了解连接'}</button>`}</article>`}).join('')}</div><p class="page-tip">本原型不会打开授权页面。正式产品应在你同意后连接账号，回到原来的任务继续。</p></div>`;}
function showConnection(id){const row=connectRows.find(r=>r[0]===id);if(!row)return;const title=row[2],pending=state.demo==='first'&&!state.connected.has(id);if(id==='wechat'&&pending){showWechatCode();return;}showDetail(`${title} · 连接示例`,`<p>${id==='wechat'?'微信是另一个入口，可以接着交代同一件事、收结果。家人的权限仍独立。':'正式产品在这里进入该服务的授权页面。回来后沿用当前任务，只使用你同意的范围。'}</p><p>本页不会登录账号、展示可扫描的二维码或读取资料。</p>${pending?`<button type="button" class="primary" data-simulate-connect="${id}">演示连接完成</button>`:''}<p class="dialog-footnote">只演示动线。连接成功不等于已读取，更不等于已开启推送。</p>`);}
function render(){
  $('composer-parking').append($('shared-composer'));
  $('page').innerHTML=state.page==='today'?renderToday():state.page==='projects'?renderProjects():state.page==='memory'?renderMemory():renderConnections();
  document.querySelectorAll('.nav button').forEach(b=>{const active=b.dataset.page===state.page;b.setAttribute('aria-selected',String(active));b.tabIndex=active?0:-1;});$('page').setAttribute('aria-labelledby','tab-'+state.page);
  $('connection-status').classList.toggle('first-use',state.demo==='first');$('connection-status').innerHTML=`<span class="status-dot ${state.demo==='first'&&!state.connected.has('wechat')?'off':state.demo==='issue'&&!state.recovered?'warn':''}"></span>${state.demo==='first'?(state.connected.has('wechat')?'微信已连接':'微信未连接'):state.demo==='issue'&&!state.recovered?'微信状态待核对':'微信可继续 · 示例'}`;
  $('floating').hidden=!state.overlay;$('launcher').setAttribute('aria-expanded',String(state.overlay));$('launcher').setAttribute('aria-label',state.overlay?'收起 Dot 对话':'和 Dot 说件事');
  $('floating-body').innerHTML=state.messages.length?state.messages.slice(-4).map(m=>`<div class="float-message ${m.role}"><span class="message-label">${m.role==='user'?'你':'Dot · 示例回复'}</span>${escapeHTML(m.text)}</div>`).join(''):`<div class="floating-welcome"><h3>在这里，直接接着说。</h3><p>不必回到首页；桌面和微信围绕同一件事继续。</p>${starterRow()}</div>`;
  if(state.overlay&&state.page!=='today')$('floating-mount').append($('shared-composer'));else if(state.page==='today')$('home-mount').append($('shared-composer'));
  $('dot-input').value=state.draft;$('draft-recovery').hidden=!state.draftBackups.length;$('draft-recovery-label').textContent=state.draftRestored?'切换前的草稿也已保留':'原草稿已保留';$('restore-draft').textContent=state.draftRestored?'切换暂存草稿':'恢复原草稿';fillIcons();
}
function focusInput(){const input=$('dot-input');input.focus({preventScroll:true});input.scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});}
function navigate(page){if(!['today','projects','memory','connections'].includes(page))return;state.page=page;if(page==='today')state.overlay=false;render();}
function openConversation(){if(state.page==='today'){state.overlay=false;render();focusInput();}else{state.overlay=true;render();focusInput();}}
function closeFloating(){state.overlay=false;render();$('launcher').focus({preventScroll:true});}
function chooseStarter(key){if(!scripts[key])return;const next=scripts[key].text;if(state.draft.trim()&&state.draft!==next)state.draftBackups.push(state.draft);state.draftRestored=false;state.draft=next;$('send-notice').hidden=true;openConversation();}
function renderHistory(){let entries=state.demo==='first'?[]:[{title:'更早的只读检查（旧验收记录）',time:'10 月 18 日 · 示例历史',text:'当时的请求：只读项目说明的第一行。\n记录保留在这里，不占据今天的首屏，也不会自动重做旧任务。'}];for(let i=0;i<state.messages.length;i+=2){entries.unshift({title:state.messages[i].text,time:'本次原型操作 · 未发送至外部',text:state.messages.slice(i,i+2).map(m=>(m.role==='user'?'你：':'Dot（示例）：')+m.text).join('\n\n')});}$('history-content').innerHTML=`<p class="history-note">${entries.length?(state.demo==='first'?'这是本次演示的对话。点击查看，不会重新执行。':'旧内容仍在。点击一条查看，不会重新执行。'):'还没有对话记录。聊过的事会保留在这里。'}</p>${entries.map((e,i)=>`<details class="history-entry" ${i===0&&state.messages.length?'open':''}><summary>${escapeHTML(e.title)}<span class="history-time">${e.time}</span></summary><p>${escapeHTML(e.text)}</p></details>`).join('')}`;}
function openHistory(){renderHistory();$('history-dialog').showModal();}
function sendDemo(event){event?.preventDefault();const text=state.draft.trim();if(!text){$('send-notice').textContent='先写一句，或选择一个示例。';$('send-notice').hidden=false;focusInput();return;}const entry=Object.entries(scripts).find(([,s])=>s.text===text);if(!entry){$('send-notice').textContent='这段草稿已保留。本原型只演示三个示例，不会理解或执行自由输入。';$('send-notice').hidden=false;focusInput();return;}const[key]=entry;commitDemo(key,true);}
function commitDemo(key,consumeDraft=false){const s=scripts[key];if(!s)return;state.messages.push({role:'user',text:s.text},{role:'assistant',text:s.reply+'\n\n'+s.next});state.result=key;state.showAttention=false;if(consumeDraft)state.draft='';$('send-notice').hidden=true;render();if(state.overlay)$('floating-body').scrollTop=$('floating-body').scrollHeight;else document.querySelector('.current-result')?.scrollIntoView({block:'nearest',behavior:'instant'});if(consumeDraft)focusInput();}
$('dot-input').addEventListener('input',e=>{state.draft=e.target.value;$('send-notice').hidden=true;});$('dot-input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.keyCode!==229){e.preventDefault();sendDemo();}});$('shared-composer').addEventListener('submit',sendDemo);
$('restore-draft').addEventListener('click',()=>{if(!state.draftBackups.length)return;const previous=state.draftBackups.pop();if(state.draft.trim()&&state.draft!==previous)state.draftBackups.unshift(state.draft);state.draft=previous;state.draftRestored=true;$('send-notice').hidden=true;render();focusInput();});
$('launcher').addEventListener('click',()=>{if(state.page==='today'){openConversation();return;}state.overlay?closeFloating():openConversation();});$('close-floating').addEventListener('click',closeFloating);$('open-workbench').addEventListener('click',()=>{navigate('today');focusInput();});$('open-history').addEventListener('click',openHistory);$('connection-status').addEventListener('click',()=>state.demo==='first'&&!state.connected.has('wechat')?showWechatCode():navigate('connections'));
$('demo-state').addEventListener('change',e=>{state.demo=e.target.value;state.recovered=false;state.result=null;state.showAttention=true;navigate('today');});$('reset-demo').addEventListener('click',()=>{state={page:'today',demo:$('demo-state').value,draft:'',draftBackups:[],draftRestored:false,qrExpired:false,overlay:false,done:false,paused:false,recovered:false,connected:new Set(),messages:[],result:null,showAttention:true};$('send-notice').hidden=true;render();showToast('示例已重置；没有更改真实账号或安排。');});
document.addEventListener('click',e=>{
 const close=e.target.closest('[data-close-dialog]');if(close){close.closest('dialog').close();if(close.dataset.action==='try-desktop'){navigate('today');focusInput();}return;}
 const source=e.target.closest('[data-source]');if(source){showSource(source.dataset.source);return;}
 const prepare=e.target.closest('[data-prepare]');if(prepare){commitDemo(prepare.dataset.prepare,false);return;}
 const starter=e.target.closest('[data-starter]');if(starter){chooseStarter(starter.dataset.starter);return;}
 const page=e.target.closest('[data-page]');if(page){navigate(page.dataset.page);return;}
 const connect=e.target.closest('[data-connect]');if(connect){showConnection(connect.dataset.connect);return;}
 const simulated=e.target.closest('[data-simulate-connect]');if(simulated){state.connected.add(simulated.dataset.simulateConnect);$('detail-dialog').close();render();if(state.page==='today')$('dot-input').focus({preventScroll:true});else $('connection-status').focus({preventScroll:true});showToast('示例连接已更新，没有连接真实账号。');return;}
 const action=e.target.closest('[data-action]')?.dataset.action;if(!action)return;
 if(action==='qr-complete'){state.connected.add('wechat');state.qrExpired=false;render();$('dot-input').focus({preventScroll:true});showToast('示例连接完成，草稿保留；未开启提醒或订阅。');return;}if(action==='qr-expire'){state.qrExpired=true;render();document.querySelector('[data-action="qr-refresh"]')?.focus({preventScroll:true});return;}if(action==='qr-refresh'){state.qrExpired=false;render();$('first-wechat-code')?.focus({preventScroll:true});return;}
 if(action==='history'){openHistory();return;}if(action==='focus'){openConversation();return;}if(action==='done'){state.done=!state.done;render();showToast('示例事项已更新，没有修改外部任务。');return;}if(action==='pause'){state.paused=!state.paused;render();showToast(state.paused?'示例安排已暂停。没有操作真实计划。':'示例安排已恢复。没有创建真实计划。');return;}if(action==='retry'){state.recovered=true;render();showToast('演示恢复完成；原草稿与安排保留。');return;}if(action==='show-attention'){state.showAttention=true;render();return;}if(action==='project-detail'){showDetail('每周内容计划 · 示例进度','<p>本周已有三个候选选题，尚未选择最终题目。下一步先明确读者最需要带走的理解，再展开初稿。</p><p class="dialog-footnote">虚构项目说明，未读取或修改任何本机项目。</p>');return;}if(action==='memory-detail'){showDetail('AI 日报关注方向 · 示例记忆','<p>演示中保存了三个方向：Agent 产品、插件生态、增长实践。</p><p>正式产品应允许在同一对话里补充或修正，并更新同一条记忆。</p><p class="dialog-footnote">本原型不把自由输入写成已保存的偏好。</p>');}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!e.isComposing&&!document.querySelector('dialog[open]')&&state.overlay){e.preventDefault();closeFloating();}});
document.querySelector('.nav').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;const tabs=[...document.querySelectorAll('.nav [role=tab]')],i=tabs.indexOf(document.activeElement);if(i<0)return;e.preventDefault();const next=e.key==='Home'?0:e.key==='End'?tabs.length-1:(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;navigate(tabs[next].dataset.page);tabs[next].focus();});
render();
</script>
</body>
</html>
